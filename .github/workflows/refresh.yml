name: Refresh curated index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate and rebuild index
        run: >-
          python scripts/build_index.py
          --output candidate_anime_index.json
          --report candidate_health_report.json
          --minimum-selected 40
      - name: Upload candidate health report
        uses: actions/upload-artifact@v4
        with:
          name: candidate-health-report
          path: candidate_health_report.json
